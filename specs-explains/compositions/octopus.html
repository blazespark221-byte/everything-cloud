  <script>
    (function () {
      const S = "octopus";
      const c = Kit.cues(S);
      const w = c.w;
      const $ = (q) => document.querySelector(q);
      const $$ = (q) => Array.from(document.querySelectorAll(q));
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";
      Kit.markers($("#oct-svg"));

      // ---------- the octopus rig: eight tapered arms drawn from time ----------
      const tSwim = w("weird", "swims") - 0.35;
      const tSink = c.s.crawl + 0.2;
      const tCrawl = w("crawl", "rather") - 0.4;
      const tCrawlEnd = c.e.crawl + 0.6;
      const tInk = c.e.alien + 0.25;
      const arms = [];
      for (let i = 0; i < 8; i++) {
        const back = document.createElementNS(NS, "path");
        back.setAttribute("fill", "#ff8a5c");
        back.setAttribute("stroke", "#1f1d1a");
        back.setAttribute("stroke-width", "5");
        back.setAttribute("stroke-linejoin", "round");
        $("#oct-armset").appendChild(back);
        arms.push(back);
      }
      // body offset over time (relative to its drawn position)
      const bodyKeys = [
        [0, 0, 0],
        [tSwim, 0, 0],
        [tSwim + 0.9, -40, -330],
        [tSink, -40, -330],
        [tSink + 1.4, 0, 0],
        [tCrawl, 0, 0],
        [tCrawlEnd, 70, 0],
      ];
      const ease = Specs.EASE.inOut;
      function bodyAt(t) {
        let cur = [0, 0];
        for (let i = 1; i < bodyKeys.length; i++) {
          const a = bodyKeys[i - 1];
          const b = bodyKeys[i];
          if (t <= a[0]) break;
          const p = Math.min(1, (t - a[0]) / Math.max(0.001, b[0] - a[0]));
          const e = i === 2 ? Specs.EASE.out(p) : ease(p);
          cur = [a[1] + (b[1] - a[1]) * e, a[2] + (b[2] - a[2]) * e];
        }
        return cur;
      }
      const ramp = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
      function modeAt(t) {
        // weights: swim (arms trailing) and crawl (stepping)
        const swim = ramp(t, tSwim - 0.1, tSwim + 0.3) * (1 - ramp(t, tSink + 0.6, tSink + 1.4));
        const crawl = ramp(t, tCrawl - 0.2, tCrawl + 0.3) * (1 - ramp(t, tCrawlEnd - 0.3, tCrawlEnd + 0.2));
        return { swim, crawl };
      }
      const sparkT = w("brain", "arms") - 0.3;
      const sparkDots = [];
      for (let i = 0; i < 8; i++) {
        for (let k = 0; k < 4; k++) {
          const d = document.createElementNS(NS, "circle");
          d.setAttribute("r", "7");
          d.setAttribute("fill", "#ffe14d");
          d.setAttribute("stroke", "#1f1d1a");
          d.setAttribute("stroke-width", "2.5");
          d.setAttribute("opacity", "0");
          $("#oct-sparks").appendChild(d);
          sparkDots.push({ el: d, arm: i, u: 0.22 + k * 0.2, t0: sparkT + k * 0.14 + (i % 4) * 0.05 });
        }
      }
      function drawOcto(t) {
        const [bx, by] = bodyAt(t);
        $("#oct-octo").setAttribute("transform", `translate(${bx.toFixed(1)} ${by.toFixed(1)})`);
        const m = modeAt(t);
        const centre = [];
        for (let i = 0; i < 8; i++) {
          const side = i < 4 ? -1 : 1;
          const k = i - 3.5;
          const restA = k * 21;
          const swimA = k * 3.5 + Math.sin(t * 3 + i) * 4;
          const crawlA = k * 24 + Math.sin(t * 7 + i * 1.7) * 14;
          let a = restA * (1 - m.swim - m.crawl) + swimA * m.swim + crawlA * m.crawl;
          const curl = side * (70 * (1 - m.swim) + 10 * m.swim);
          const wig = 7 + 5 * m.swim;
          const L = 255 + 70 * m.swim;
          const N = 22;
          let p = [1200 + k * 26, 626];
          let th = a;
          const pts = [p];
          for (let j = 1; j <= N; j++) {
            const u = j / N;
            th = a + curl * u * u + wig * Math.sin(u * 6.5 - t * 2.2 + i * 0.9);
            const d = (L / N) * (Math.PI / 180);
            p = [p[0] + Math.sin(th * (Math.PI / 180)) * (L / N), p[1] + Math.cos(th * (Math.PI / 180)) * (L / N)];
            // keep resting arms on the seabed
            if (m.swim < 0.5 && p[1] > 880 - by) p[1] = 880 - by + (p[1] - (880 - by)) * 0.2;
            pts.push(p);
          }
          centre.push(pts);
          const left = [];
          const right = [];
          for (let j = 0; j <= N; j++) {
            const q = pts[j];
            const n0 = pts[Math.max(0, j - 1)];
            const n1 = pts[Math.min(N, j + 1)];
            const dx = n1[0] - n0[0];
            const dy = n1[1] - n0[1];
            const len = Math.hypot(dx, dy) || 1;
            const half = (30 * (1 - j / N) + 5) / 2;
            left.push([q[0] - (dy / len) * half, q[1] + (dx / len) * half]);
            right.push([q[0] + (dy / len) * half, q[1] - (dx / len) * half]);
          }
          const f = (v) => v[0].toFixed(1) + " " + v[1].toFixed(1);
          let d = "M" + f(left[0]);
          for (let j = 1; j <= N; j++) d += " L" + f(left[j]);
          d += " Q" + f([pts[N][0] + (pts[N][0] - pts[N - 1][0]) * 0.8, pts[N][1] + (pts[N][1] - pts[N - 1][1]) * 0.8]) + " " + f(right[N]);
          for (let j = N - 1; j >= 0; j--) d += " L" + f(right[j]);
          arms[i].setAttribute("d", d + " Z");
        }
        // neuron sparks ride the arms
        for (const s of sparkDots) {
          const pts = centre[s.arm];
          const q = pts[Math.round(s.u * (pts.length - 1))];
          s.el.setAttribute("cx", (q[0] + bx).toFixed(1));
          s.el.setAttribute("cy", (q[1] + by).toFixed(1));
          const on = t >= s.t0 && t < tInk;
          const pulse = on ? 0.75 + 0.25 * Math.sin((t - s.t0) * 6 + s.arm) : 0;
          s.el.setAttribute("opacity", on ? Math.min(1, (t - s.t0) * 6).toFixed(2) : 0);
          s.el.setAttribute("r", (7 * (on ? pulse + 0.25 : 1)).toFixed(1));
        }
        // eyes: look at Specs, blink now and then, droop when tired
        const look = t < sparkT ? -1 : 0;
        $("#oct-pupil-l").setAttribute("cx", (1146 + look * 9).toFixed(1));
        $("#oct-pupil-r").setAttribute("cx", (1254 + look * 9).toFixed(1));
        const blink = [5.2, 13.4, 19.9, 31.0, 38.6, 47.2, 55.1].some((b) => t > b && t < b + 0.16);
        const tired = ramp(t, tSink, tSink + 0.4) * (1 - ramp(t, tCrawlEnd, tCrawlEnd + 0.4));
        const lid = blink ? 1 : tired * 0.45;
        if (lid > 0.02) {
          const yl = 544 + lid * 56;
          $("#oct-lid").setAttribute("d", `M1118 ${yl} L1118 560 A28 28 0 0 1 1174 560 L1174 ${yl} Z M1226 ${yl} L1226 560 A28 28 0 0 1 1282 560 L1282 ${yl} Z`);
        } else $("#oct-lid").setAttribute("d", "");
      }

      // ---------- Specs, snorkel and all ----------
      const SX = 400;
      const rig = Specs.create($("#oct-specs-g"), {
        scene: S,
        x: SX,
        y: 900,
        s: 0.85,
        poses: [
          [0, "relaxed", 0],
          [c.s.q - 0.1, "point-r", 0.4, "back"],
