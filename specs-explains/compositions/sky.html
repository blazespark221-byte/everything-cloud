    (function () {
      const S = "sky";
      const c = Kit.cues(S);
      const w = c.w;
      const $ = (q) => document.querySelector(q);
      const $$ = (q) => Array.from(document.querySelectorAll(q));
      const tl = gsap.timeline({ paused: true });
      Kit.markers($("#sky-svg"));

      // ---------- part 1: the studio, reading the note, diving into the lens ----------
      const tUnfold = c.s.q - 0.35;
      const tCardOut = w("closer", "Let's") - 0.1;
      const tPush = w("closer", "closer") - 0.35;
      const tZoom = w("closer", "look") - 0.15;
      const ZOOM = 1.35;
      const tSwitch = tZoom + ZOOM;

      const studio = Specs.create($("#sky-studio-specs"), {
        scene: S,
        x: 1112,
        y: 905,
        s: 1,
        poses: [
          [0, "hold-up-r", 0],
          [tUnfold + 0.1, "explain-l", 0.4],
          [w("closer", "Ooh") - 0.1, "fist-up", 0.3, "back"],
          [tPush, "push-glasses", 0.35, "back"],
        ],
        faces: [
          [0, "excited", 0],
          [c.s.q, "thinking", 0.3],
          [w("closer", "Ooh"), "excited", 0.25],
          [tPush + 0.3, "smug", 0.3],
        ],
        looks: [
          [0, 0.3, -0.5, 0],
          [tUnfold, -0.8, -0.6, 0.3],
          [w("closer", "Ooh"), 0, 0.05, 0.3],
        ],
      });
      const note = $("#sky-note");
      const portal = $("#sky-portal");
      let lens = [0, 0];
      const scam = Kit.camera($("#sky-studio-cam"), [
        [tZoom, (t) => lens[0], (t) => lens[1], 62, ZOOM, "in"],
      ]);

      // card: unfolds out of the note into the question
      tl.fromTo("#sky-card", { x: 1240, y: 520, scale: 0.08, transformOrigin: "50% 50%", rotation: -10, opacity: 0 }, { x: 760, y: 250, scale: 1, rotation: -2, opacity: 1, duration: 0.55, ease: "back.out(1.6)" }, tUnfold);
      tl.to("#sky-card", { transformOrigin: "50% 50%", x: 520, y: -260, rotation: -12, scale: 0.7, duration: 0.4, ease: "power3.in" }, tCardOut);
      tl.fromTo(portal, { opacity: 0 }, { opacity: 1, duration: ZOOM * 0.45, ease: "power1.in" }, tZoom + ZOOM * 0.2);
      tl.set("#sky-studio-cam", { opacity: 0 }, tSwitch);
      tl.set("#sky-world", { opacity: 1 }, tSwitch);

      // ---------- part 2: the sky world ----------
      const SX = 1560;
      const SY = 868;
      const sky = Specs.create($("#sky-specs"), {
        scene: S,
        x: SX,
        y: SY,
        s: 0.78,
        poses: [
          [0, "relaxed", 0],
          [c.s.white - 0.2, "point-ul", 0.4, "back"],
          [c.s.colours - 0.2, "explain-l", 0.4],
          [c.s.crash - 0.2, "point-l", 0.4, "back"],
          [c.s.molecules - 0.1, "present-l", 0.45],
          [c.s.trick - 0.1, "think", 0.4],
          [c.s.everywhere - 0.2, "relaxed", 0.4],
          [w("everywhere", "every direction") - 0.3, "arms-up", 0.45, "back"],
          [c.s.glows - 0.1, "cheer", 0.35, "back"],
          [c.s.rayleigh - 0.15, "point-ul", 0.4, "back"],
          [c.s.violet - 0.1, "scratch-head", 0.4],
          [w("violet", "So why") - 0.1, "shrug", 0.35, "back"],
          [c.s.less - 0.1, "explain", 0.4],
          [w("less", "our eyes") - 0.2, "push-glasses", 0.35, "back"],
          [c.s.sunset - 0.2, "present-l", 0.45],
          [c.s.scatter - 0.1, "explain-l", 0.4],
          [c.s.painted - 0.1, "hand-chest", 0.4],
          [w("painted", "sunlight") - 0.2, "present-l", 0.45],
        ],
        faces: [
          [0, "happy", 0],
          [c.s.colours, "excited", 0.3],
          [c.s.crash, "happy", 0.3],
          [c.s.trick, "thinking", 0.3],
          [w("everywhere", "every direction"), "amazed", 0.3],
          [c.s.glows, "excited", 0.25],
          [c.s.rayleigh, "smug", 0.3],
          [c.s.violet, "thinking", 0.3],
          [w("violet", "So why"), "shocked", 0.2],
          [c.s.less, "happy", 0.3],
          [w("less", "our eyes"), "wince", 0.25],
          [c.e.less, "happy", 0.3],
          [c.s.sunset, "thinking", 0.3],
          [c.s.painted, "proud", 0.3],
        ],
        looks: [
          [0, -0.7, -0.5, 0],
          [c.s.colours, -0.8, -0.4, 0.3],
          [c.s.everywhere, -0.6, -0.8, 0.3],
          [w("everywhere", "every direction"), 0.7, -0.7, 0.35],
          [w("everywhere", "every direction") + 0.6, -0.7, -0.7, 0.35],
          [c.s.glows, 0, -0.3, 0.3],
          [c.s.rayleigh, -0.6, -0.8, 0.3],
          [c.s.violet, -0.4, -0.6, 0.3],
          [w("violet", "So why"), 0, 0.05, 0.25],
          [c.s.less, -0.8, -0.5, 0.3],
          [w("less", "our eyes"), 0, 0.05, 0.25],
          [c.s.sunset, -0.8, -0.6, 0.3],
          [c.s.painted, 0, 0.05, 0.3],
          [w("painted", "sunlight"), -0.9, 0.1, 0.35],
        ],
      });

      const tDive = c.e.painted + 0.35;
      const wcam = Kit.camera($("#sky-wcam"), [
        [c.s.colours - 0.5, 540, 300, 1.75, 0.9],
        [c.s.crash - 0.3, 960, 540, 1, 1.0],
        [w("trick", "Those") - 0.4, 1000, 405, 2.1, 1.2],
        [c.s.everywhere - 0.3, 960, 540, 1, 1.1],
        [tDive, 520, 1640, 1.5, 1.9, "inOut"],
      ]);

      Kit.driver(tl, c.dur, (t) => {
        if (t < tSwitch) {
          const p = studio.render(t);
          lens = p.lensL;
          scam.render(t);
          portal.setAttribute("cx", lens[0].toFixed(2));
          portal.setAttribute("cy", lens[1].toFixed(2));
          if (t < tUnfold + 0.05) {
            const h = p.handR;
            note.setAttribute("transform", `translate(${h[0].toFixed(1)} ${(h[1] - 16).toFixed(1)}) rotate(-10)`);
            note.setAttribute("opacity", 1);
          } else note.setAttribute("opacity", 0);
        } else {
          sky.render(t);
          wcam.render(t);
        }
      });

      // the world draws itself in
      Kit.pop(tl, "#sky-sun", tSwitch + 0.05, { dur: 0.6 });
      tl.fromTo("#sky-rays", { rotation: 0 }, { rotation: 40, duration: c.dur - tSwitch, ease: "none", transformOrigin: "50% 50%" }, tSwitch);
      tl.fromTo("#sky-land", { opacity: 0 }, { opacity: 1, duration: 0.3 }, tSwitch);
      tl.fromTo("#sky-specs", { opacity: 0 }, { opacity: 1, duration: 0.3 }, tSwitch + 0.1);

      // white light, then its six colours as each is named
      Kit.draw(tl, "#sky-beam-a path", c.s.white + 0.4, 0.9, "power2.out");
      const strands = ["red", "orange", "yellow", "green", "blue", "violet"];
      strands.forEach((k) => Kit.draw(tl, `#sky-s-${k}`, w("colours", k) - 0.1, 0.45, "power2.out"));
      tl.to("#sky-beam-a", { opacity: 0, duration: 0.3 }, w("colours", "red") - 0.2);
      tl.to("#sky-strands", { scaleY: 0.25, transformOrigin: "50% 50%", duration: 0.5, ease: "power2.inOut" }, w("colours", "all travelling"));
      tl.to("#sky-beam-a", { opacity: 1, duration: 0.4 }, w("colours", "as one"));
      tl.to("#sky-strands", { opacity: 0, duration: 0.3 }, w("colours", "as one") + 0.3);

      // the beam crashes on into the air
      Kit.draw(tl, "#sky-beam-b path", w("crash", "crash") - 0.2, 0.7, "power2.in");
      $$("#sky-mols .mol > g").forEach((m, i) => {
        Kit.pop(tl, m, c.s.molecules + 0.15 + i * 0.09, { dur: 0.45 });
        const per = 1.1 + (i % 4) * 0.23;
        const n = Math.max(0, Math.floor((c.dur - c.s.molecules) / per) - 1);
        tl.to(m, { rotation: i % 2 ? 14 : -14, duration: per, ease: "sine.inOut", repeat: n, yoyo: true, transformOrigin: "50% 50%" }, c.s.molecules + 0.7);
      });
      Kit.draw(tl, "#sky-n-label path", w("molecules", "nitrogen") - 0.2, 0.4);
      Kit.show(tl, "#sky-n-label text", w("molecules", "nitrogen"), 0.25);
      Kit.draw(tl, "#sky-o-label path", w("molecules", "oxygen") - 0.2, 0.4);
      Kit.show(tl, "#sky-o-label text", w("molecules", "oxygen"), 0.25);
      Kit.hide(tl, ["#sky-n-label", "#sky-o-label"], c.s.trick + 0.2, 0.3);
      tl.to("#sky-beam-a, #sky-beam-b", { opacity: 0.25, duration: 0.5 }, c.s.trick);

      // red: long and lazy, slips past
      Kit.draw(tl, "#sky-red-wave path", w("red", "Red") - 0.1, 2.2, "none");
      Kit.show(tl, "#sky-red-label", w("red", "long"), 0.25);
      tl.to("#sky-red-wave path", { strokeDashoffset: -1.05, duration: 1.6, ease: "power1.in" }, w("red", "slips") + 0.2);
      Kit.hide(tl, "#sky-red-label", c.e.red - 0.3, 0.25);

      // blue: short and choppy, gets knocked everywhere
      tl.fromTo("#sky-blue-wave path", { strokeDashoffset: 1.05 }, { strokeDashoffset: 0, duration: 1.3, ease: "none" }, w("blue", "Blue") - 0.1);
      Kit.show(tl, "#sky-blue-label", w("blue", "short"), 0.25);
      const tHit = w("blue", "knocked") - 0.1;
      tl.to("#sky-blue-wave path", { strokeDashoffset: -1.05, duration: 0.35, ease: "power2.in" }, tHit - 0.2);
      tl.fromTo("#sky-mstar", { x: 0 }, { x: 7, duration: 0.05, repeat: 5, yoyo: true, ease: "none" }, tHit);
      gsap.set("#sky-burst path", { attr: { fill: "none", stroke: "#2f80ed", "stroke-width": 8, "stroke-linecap": "round", "stroke-linejoin": "round" } });
      Kit.draw(tl, "#sky-burst path", tHit, 0.5, "power2.out", 0.04);
      Kit.hide(tl, "#sky-blue-label", c.e.blue, 0.25);

      // ... from every direction
      gsap.set("#sky-zig path, #sky-arrows path", { attr: { fill: "none", stroke: "#2f80ed", "stroke-width": 7, "stroke-linecap": "round", "stroke-linejoin": "round" } });
      Kit.draw(tl, "#sky-zig path", c.s.everywhere + 0.4, 0.6, "power2.out", 0.18);
      Kit.draw(tl, "#sky-arrows path", w("everywhere", "coming") - 0.2, 0.6, "power2.out", 0.2);

      // the whole sky glows blue
      tl.to("#sky-bg", { fill: "#79b8ef", duration: 0.7, ease: "power2.inOut" }, c.s.glows + 0.1);
      Kit.hide(tl, ["#sky-zig", "#sky-arrows", "#sky-burst"], c.s.glows + 0.3, 0.5);
      tl.fromTo("#sky-rayleigh", { opacity: 0, scale: 0.9, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, w("rayleigh", "Rayleigh") - 0.1);
      Kit.draw(tl, "#sky-rayleigh-line", w("rayleigh", "scattering"), 0.45);
      Kit.hide(tl, ["#sky-rayleigh", "#sky-rayleigh-line"], c.s.violet + 0.6, 0.3);

      // violet: even shorter. Why not purple?
      Kit.draw(tl, "#sky-violet path", w("violet", "Violet") - 0.1, 1.0, "none");
      tl.to("#sky-bg", { fill: "#a98bf0", duration: 0.35, ease: "power2.out" }, w("violet", "purple") - 0.25);
      Kit.pop(tl, "#sky-violet-q", w("violet", "purple") - 0.1, { dur: 0.45 });
      tl.to("#sky-bg", { fill: "#79b8ef", duration: 0.5, ease: "power2.inOut" }, c.s.less + 0.1);
      Kit.hide(tl, "#sky-violet", c.s.less, 0.3);

      // the Sun sends less violet; our eyes barely see it
      Kit.draw(tl, "#sky-chart > path", c.s.less + 0.1, 0.4);
      tl.fromTo("#sky-chart .bar", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.45, ease: "back.out(1.6)", stagger: 0.08 }, c.s.less + 0.3);
      Kit.draw(tl, "#sky-less path", w("less", "less violet") + 0.1, 0.35);
      Kit.show(tl, "#sky-less text", w("less", "less violet") + 0.2, 0.25);
      Kit.hide(tl, "#sky-chart", c.s.sunset - 0.2, 0.3);
      Kit.hide(tl, ["#sky-mols", "#sky-beam-a", "#sky-beam-b"], c.s.sunset, 0.5);

      // sunset: the long way through the air
      tl.fromTo("#sky-inset", { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.5)" }, c.s.sunset + 0.1);
      Kit.draw(tl, "#sky-noon path", c.s.sunset + 0.6, 0.5);
      Kit.draw(tl, "#sky-longray", w("sunset", "travel") - 0.1, 1.2, "power1.inOut");
      Kit.show(tl, "#sky-moreair", w("sunset", "much more air"), 0.3);
      Kit.draw(tl, "#sky-peel path", w("scatter", "blue") - 0.2, 0.4, "power2.out", 0.15);
      tl.to("#sky-peel", { y: -30, opacity: 0, duration: 1.0, ease: "power1.in" }, w("scatter", "scattered") + 0.3);
      tl.to("#sky-longray", { stroke: "#ff6a3d", duration: 1.2, ease: "power1.inOut" }, w("scatter", "scattered"));
      tl.to("#sky-bg", { fill: "#f4a06e", duration: 1.6, ease: "power2.inOut" }, w("scatter", "leaving") - 0.4);
      tl.to("#sky-dusk", { opacity: 1, duration: 1.6, ease: "power2.inOut" }, w("scatter", "leaving") - 0.4);
      tl.to("#sky-sun", { x: 60, y: 640, scale: 1.25, duration: 4.5, ease: "power1.inOut", transformOrigin: "50% 50%" }, w("scatter", "scattered"));
      tl.to("#sky-sun-fill", { fill: "#ff7a45", duration: 2.5 }, w("scatter", "leaving"));
      tl.to("#sky-inset", { opacity: 0, scale: 0.9, duration: 0.3, ease: "power2.in", transformOrigin: "50% 50%" }, c.s.painted - 0.1);

      // the sun sinks into the sea and we follow it down
      tl.to("#sky-sun", { y: 900, duration: 1.4, ease: "power2.in", transformOrigin: "50% 50%" }, tDive - 0.4);
      tl.to("#sky-sea", { fill: "#2f8fb4", duration: 1.6 }, tDive);
      Kit.show(tl, "#sky-bubbles", tDive + 0.8, 0.5);
      tl.fromTo("#sky-bubbles circle", { y: 0 }, { y: -160, duration: 1.4, ease: "none", stagger: 0.1 }, tDive + 0.6);

      window.__timelines[S] = tl;
    })();
  </script>
</template>
