      const w = c.w;

      const tl = gsap.timeline({ paused: true });

      // the ink clears, blob by blob
      tl.set("#ban-inkrect", { opacity: 0 }, 0.05);
      $$("#ban-inkcover .blob").forEach((b, i) => {
        tl.fromTo(b, { scale: 1, transformOrigin: "50% 50%" }, { scale: 0, duration: 0.7, ease: "power2.in" }, 0.05 + ((i * 3) % 7) * 0.07);
      });

      const SX = 330;
      const tBonk = 1.15;
      const tCatch = 1.45;
      const tToss = c.s.fit - 0.55;

        scene: S,
        x: SX,
        y: 900,
        s: 0.9,
        poses: [
          [0, "relaxed", 0],
          [tBonk, "crouch", 0.12],
          [tCatch, "hold-up-r", 0.3, "back"],
          [w("q", "Is a") - 0.2, "hold-r", 0.35],
          [c.s.botanist - 0.1, "explain-r", 0.4],
          [w("botanist", "one flower") - 0.2, "point-r", 0.35, "back"],
          [w("botanist", "single ovary") - 0.2, "point-dr", 0.35],
          [c.s.inside - 0.1, "present-r", 0.4],
          [tToss - 0.25, "hold-up-r", 0.25],
          [tToss, "point-r", 0.25, "back"],
          [w("fit", "See") - 0.3, "push-glasses", 0.35, "back"],
          [c.s.seeds - 0.1, "explain-r", 0.4],
          [c.s.yes - 0.1, "fist-up", 0.3, "back"],
          [c.s.club - 0.1, "present-r", 0.45],
          [c.s.straw - 0.1, "shrug", 0.35],
          [w("straw", "Not") - 0.2, "hips", 0.35, "back"],
          [c.s.outside - 0.1, "explain-r", 0.4],
          [c.s.fruit - 0.1, "point-r", 0.35, "back"],
          [c.s.rasp - 0.1, "hips", 0.35],
          [c.s.lying - 0.1, "explain", 0.4],
          [w("lying", "The banana") - 0.2, "present-r", 0.4, "back"],
          [c.e.lying + 0.4, "arms-up", 0.3, "back"],
        ],
        faces: [
          [0, "neutral", 0],
          [tBonk, "wince", 0.08],
          [tCatch + 0.2, "surprised", 0.2],
          [c.s.q, "excited", 0.3],
          [w("q", "Is a"), "thinking", 0.3],
          [c.s.botanist, "smug", 0.3],
          [c.s.fit, "happy", 0.3],
          [w("fit", "See"), "thinking", 0.3],
          [c.s.seeds, "happy", 0.3],
          [c.s.yes, "excited", 0.25],
          [c.s.club, "grin", 0.3],
          [c.s.straw, "skeptical", 0.3],
          [c.s.fruit, "amazed", 0.3],
          [c.s.rasp, "skeptical", 0.3],
          [c.s.lying, "smug", 0.3],
          [w("lying", "The banana"), "proud", 0.3],
          [c.e.lying + 0.4, "surprised", 0.2],
        ],
        looks: [
          [0, 0, -0.9, 0],
          [tCatch, 0.6, -0.4, 0.2],
          [c.s.q, 0, 0.05, 0.3],
          [c.s.botanist, 0.8, -0.5, 0.3],
          [c.s.club, 0.8, -0.1, 0.3],
          [c.s.straw, 0.9, 0, 0.3],
          [c.s.lying, 0, 0.05, 0.3],
          [w("lying", "The banana"), 0.8, -0.4, 0.3],

        ],
      });

      const cam = Kit.camera($("#ban-cam"), [
        [c.s.outside - 0.3, 1660, 760, 2.1, 1.0],
        [c.s.rasp - 0.4, 960, 540, 1, 1.0],
      ]);
      const held = $("#ban-held");
      const bonk = $("#ban-bonk");
      Kit.driver(tl, c.dur, (t) => {
        const p = rig.render(t);
        cam.render(t);
        // a banana falls on his head, he catches it, later tosses it into the diagram
        if (t < tCatch) {
          const h = p.head;
          const k = Math.min(1, t / tBonk);
          const y = -200 + (h[1] - 70 + 200) * k * k;
          const bounce = t > tBonk ? Math.sin(((t - tBonk) / (tCatch - tBonk)) * Math.PI) * 40 : 0;
          held.setAttribute("transform", `translate(${(h[0] + (t > tBonk ? (t - tBonk) * 200 : 0)).toFixed(1)} ${(y - bounce).toFixed(1)}) rotate(${(t * 220).toFixed(1)})`);
          held.setAttribute("opacity", 1);
        } else if (t < tToss) {
          const hd = p.handR;
          held.setAttribute("transform", `translate(${hd[0].toFixed(1)} ${(hd[1] - 30).toFixed(1)}) rotate(10)`);
          held.setAttribute("opacity", 1);
        } else held.setAttribute("opacity", 0);
        const showBonk = t > tBonk && t < tBonk + 0.45;
        bonk.setAttribute("opacity", showBonk ? 1 : 0);
        if (showBonk) bonk.setAttribute("transform", `translate(${p.head[0].toFixed(1)} ${(p.head[1] - 70).toFixed(1)})`);
      });

      // the question
      tl.fromTo("#ban-card", { x: 520, y: 520, scale: 0.08, transformOrigin: "50% 50%", rotation: 8, opacity: 0 }, { x: 1060, y: 200, scale: 1, rotation: -2, opacity: 1, duration: 0.55, ease: "back.out(1.6)" }, w("q", "Is a") - 0.25);
      tl.to("#ban-card", { transformOrigin: "50% 50%", y: -260, rotation: 6, scale: 0.8, duration: 0.4, ease: "power3.in" }, c.s.botanist + 0.3);

      // definition, with a flower that turns into a fruit
      gsap.set(["#ban-check text", "#ban-c1", "#ban-c2", "#ban-c3"], { opacity: 0 });
      Kit.show(tl, "#ban-check > text", c.s.botanist + 0.4, 0.3);
      Kit.draw(tl, "#ban-stem", w("botanist", "fruit") - 0.3, 0.6);
      tl.fromTo("#ban-flower .mk-fill, #ban-leaf", { opacity: 0 }, { opacity: 1, duration: 0.3 }, w("botanist", "fruit"));
      Kit.pop(tl, "#ban-petals", w("botanist", "one flower") - 0.15, { dur: 0.5 });
      Kit.show(tl, "#ban-c1", w("botanist", "one flower"), 0.25);
      Kit.show(tl, "#ban-c1 text", w("botanist", "one flower"), 0.25);
      gsap.set("#ban-ovary-in", { opacity: 0 });
      Kit.pop(tl, "#ban-ovary-in", w("botanist", "single ovary") - 0.2, { dur: 0.45 });
      Kit.show(tl, "#ban-c2", w("botanist", "single ovary"), 0.25);
      Kit.show(tl, "#ban-c2 text", w("botanist", "single ovary"), 0.25);
      gsap.set("#ban-seeds", { opacity: 0 });
      tl.to("#ban-petals .petal, #ban-petals .mk-fill", { y: 380, rotation: 80, opacity: 0, duration: 0.9, ease: "power2.in", stagger: 0.05 }, c.s.inside - 0.2);
      tl.to("#ban-ovary-in", { scale: 3.3, y: -10, duration: 0.8, ease: "back.out(1.4)", transformOrigin: "50% 50%" }, c.s.inside + 0.2);
      Kit.show(tl, "#ban-seeds", w("inside", "seeds") - 0.1, 0.3);
      Kit.show(tl, "#ban-c3", w("inside", "seeds"), 0.25);
      Kit.show(tl, "#ban-c3 text", w("inside", "seeds"), 0.25);
      Kit.out(tl, "#ban-flower", tToss - 0.1, { dur: 0.3 });

      // the banana flies in and gets sliced open
      tl.fromTo("#ban-m-banana-in", { x: -440, y: -380, rotation: -200, opacity: 0 }, { x: 40, y: -180, rotation: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, tToss);
      gsap.set("#ban-m-banana use[href='#ban-face']", { opacity: 0 });
      Kit.pop(tl, "#ban-slice", w("fit", "See") - 0.1, { dur: 0.5 });
      Kit.draw(tl, "#ban-ring", w("fit", "specks") - 0.1, 0.5);
      Kit.draw(tl, "#ban-baby path", c.s.seeds, 0.35);
      Kit.show(tl, "#ban-baby text", c.s.seeds + 0.1, 0.25);
      Kit.draw(tl, ["#ban-t1", "#ban-t2", "#ban-t3"], w("fit", "perfectly") - 0.1, 0.25, "power2.out", 0.22);
      tl.fromTo("#ban-stamp-in", { scale: 2.2, opacity: 0, rotation: -16 }, { scale: 1, opacity: 1, rotation: -8, duration: 0.16, ease: "power4.in", transformOrigin: "50% 50%" }, w("yes", "berry") - 0.2);
      Kit.out(tl, ["#ban-check", "#ban-slice", "#ban-stamp"], c.s.club - 0.35, { dur: 0.3 });

      // banana walks to the head of the club line, members join as named
      tl.to("#ban-m-banana-in", { x: 0, y: 0, duration: 0.5, ease: "power2.inOut" }, c.s.club - 0.3);
      tl.to("#ban-m-banana use[href='#ban-face']", { opacity: 1, duration: 0.2 }, c.s.club);
      gsap.set("#ban-banner", { opacity: 0 });
      tl.fromTo("#ban-banner", { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, c.s.club - 0.2);
      [
        ["#ban-m-grapes > g", "grapes"],
        ["#ban-m-tomato > g", "tomatoes"],
        ["#ban-m-kiwi > g", "kiwis"],
        ["#ban-m-egg > g", "eggplants"],
      ].forEach(([sel, word]) => {
        tl.fromTo(sel, { y: -500, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "bounce.out" }, w("club", word) - 0.35);
      });

      // strawberry and raspberry are turned away
      gsap.set("#ban-post", { opacity: 0 });
      Kit.show(tl, "#ban-post", c.s.straw - 0.3, 0.3);
      tl.fromTo("#ban-straw-in", { x: 400 }, { x: 0, duration: 0.8, ease: "power2.out" }, c.s.straw - 0.2);
      tl.fromTo("#ban-straw-in", { y: 0 }, { keyframes: [{ y: -40, duration: 0.2 }, { y: 0, duration: 0.2 }, { y: -40, duration: 0.2 }, { y: 0, duration: 0.2 }] }, c.s.straw - 0.2);
      tl.fromTo("#ban-x1", { scale: 2.4, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.18, ease: "power4.in" }, w("straw", "Not") - 0.05);
      tl.to("#ban-x1", { opacity: 0, duration: 0.25 }, c.s.outside - 0.2);
      Kit.draw(tl, "#ban-seedring", w("outside", "seeds") - 0.2, 0.5);
      tl.to("#ban-straw-seeds", { scale: 1.06, duration: 0.2, yoyo: true, repeat: 3, transformOrigin: "50% 50%" }, w("outside", "outside"));
      gsap.set("#ban-loupe", { opacity: 0 });
      Kit.pop(tl, "#ban-loupe", w("fruit", "little seeds") - 0.2, { dur: 0.5 });
      Kit.out(tl, ["#ban-loupe", "#ban-seedring"], c.s.rasp - 0.4, { dur: 0.3 });
      tl.fromTo("#ban-rasp-in", { x: 300 }, { x: 0, duration: 0.7, ease: "power2.out" }, c.s.rasp - 0.3);
      tl.fromTo("#ban-x2", { scale: 2.4, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.18, ease: "power4.in" }, w("rasp", "aren't") - 0.05);
      tl.to("#ban-x2", { opacity: 0, duration: 0.25 }, c.s.lying);

      // the signs
      tl.to("#ban-banner", { y: -320, duration: 0.45, ease: "power2.in" }, c.s.lying - 0.4);
      tl.fromTo("#ban-sign-berry", { y: -480 }, { y: 0, duration: 0.6, ease: "bounce.out" }, c.s.lying - 0.3);
      Kit.draw(tl, "#ban-sign-x", w("lying", "lying") - 0.1, 0.35);
      tl.fromTo("#ban-sign-ban", { y: -480 }, { y: 0, duration: 0.6, ease: "bounce.out" }, w("lying", "The banana") - 0.4);
      gsap.set("#ban-sign-note", { opacity: 0 });
      tl.fromTo("#ban-sign-note", { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, w("lying", "is not") - 0.1);

      // honey drips in and floods the page
      const tDrip = c.e.lying + 0.35;
      tl.fromTo("#ban-drip", { y: -270 }, { y: 0, duration: 0.9, ease: "power2.out" }, tDrip);
      tl.fromTo("#ban-flood", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.8, ease: "power2.in" }, tDrip + 0.75);

      window.__timelines[S] = tl;
    })();
  </script>
</template>
