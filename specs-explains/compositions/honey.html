      <path id="hon-drain" d="M-20 0 C 120 -26, 200 30, 340 4 C 470 -20, 560 34, 700 6 C 840 -22, 960 30, 1100 2 C 1240 -24, 1340 30, 1480 4 C 1620 -20, 1720 30, 1940 0 L1940 1120 L-20 1120 Z" fill="#f2a007" stroke="#1f1d1a" stroke-width="6" />
      <image href="assets/grain.png" x="0" y="0" width="1920" height="1080" />
    </svg>
  </div>
  <script src="assets/data/timing.js"></script>
  <script src="assets/data/lipsync.js"></script>
  <script src="assets/specs.js"></script>
  <script src="assets/kit.js"></script>
  <script>
    (function () {
      const S = "honey";
      const c = Kit.cues(S);
      const w = c.w;
      const $ = (q) => document.querySelector(q);
      const $$ = (q) => Array.from(document.querySelectorAll(q));
      const tl = gsap.timeline({ paused: true });
      Kit.markers($("#hon-svg"));

      // the honey drains off the page
      tl.fromTo("#hon-drain", { y: -60 }, { y: 1150, duration: 1.2, ease: "power2.in" }, 0.05);

      const tWalk1 = c.s.tombs + 0.3;
      const tLift = c.s.spoiled - 0.35;
      const tBack = c.s.how - 0.1;
      const tLens = c.s.sugar - 0.3;
      const tLensOut = c.s.lid - 0.5;
      const tWalk2 = c.s.lid - 0.35;
      const tLidOn = w("lid", "If honey") - 0.45;
      const tWhip = c.e.warm + 0.9;
      const lidReach = Specs.reach("reach-r", "R", (1150 - 890) / 0.9, (548 - 900) / 0.9, 1);

      const rig = Specs.create($("#hon-specs"), {
        scene: S,
        x: 560,
        y: 900,
        s: 0.9,
        poses: [
          [0, "relaxed", 0],
          [c.s.q - 0.1, "explain", 0.4],
          [w("q", "Does") - 0.2, "think", 0.4],
          [c.s.tombs - 0.1, "relaxed", 0.4],
          [w("tombs", "found") - 0.2, "point-r", 0.4, "back"],
          [tLift - 0.3, lidReach, 0.35],
          [tLift + 0.25, "hold-up-r", 0.3, "back"],
          [w("spoiled", "spoiled") - 0.2, "arms-up", 0.35, "back"],
          [tBack, "relaxed", 0.3],
          [w("how", "Three") - 0.2, "fist-up", 0.35, "back"],
          [c.s.sugar - 0.1, "present-r", 0.45],
          [c.s.germs - 0.1, "explain-r", 0.4],
          [w("germs", "shrivels") - 0.2, "shrug", 0.35, "back"],
          [c.s.acid - 0.1, "present-r", 0.45],
          [w("acid", "Germs hate") - 0.2, "hand-mouth", 0.35],
          [c.s.enzyme - 0.1, "point-ur", 0.4, "back"],
          [c.s.peroxide - 0.1, "explain-r", 0.4],
          [w("peroxide", "zapper") - 0.25, "fist-up", 0.3, "back"],
          [tWalk2, "relaxed", 0.3],
          [tLidOn - 0.3, lidReach, 0.35],
          [tLidOn + 0.4, "think", 0.4],
          [c.s.crystals - 0.1, "explain-r", 0.4],
          [w("crystals", "hasn't") - 0.2, "shrug", 0.35],
          [w("crystals", "crystals") - 0.2, "present-r", 0.4, "back"],
          [c.s.warm - 0.1, "explain-r", 0.4],
          [w("warm", "melts") - 0.2, "cheer", 0.35, "back"],
          [tWhip - 0.4, "point-r", 0.3, "back"],
        ],
        faces: [
          [0, "happy", 0],
          [w("q", "Does"), "thinking", 0.3],
          [c.s.tombs, "smug", 0.3],
          [tLift, "thinking", 0.3],
          [c.s.spoiled, "amazed", 0.25],
          [c.s.how, "happy", 0.3],
          [w("how", "Three"), "excited", 0.25],
          [c.s.sugar, "happy", 0.3],
          [w("germs", "shrivels"), "grin", 0.3],
          [c.s.acid, "happy", 0.3],
          [w("acid", "Germs hate"), "wince", 0.25],
          [c.s.enzyme, "excited", 0.3],
          [w("peroxide", "zapper"), "grin", 0.25],
          [c.s.lid, "happy", 0.3],
          [w("lid", "ferment"), "worried", 0.3],
          [c.s.crystals, "worried", 0.3],
          [w("crystals", "hasn't"), "happy", 0.3],
          [c.s.warm, "smug", 0.3],
          [w("warm", "melts"), "excited", 0.25],
        ],
        looks: [
          [0, 0, 0.05, 0],
          [c.s.tombs, 0.8, -0.6, 0.3],
          [tLift, 0.9, 0, 0.3],
          [c.s.spoiled, 0, 0.05, 0.3],
          [c.s.sugar, 0.9, -0.3, 0.3],
          [c.s.how, 0, 0.05, 0.3],
          [c.s.sugar + 0.4, 0.9, -0.2, 0.3],
          [c.s.lid, 0.8, 0.2, 0.3],
          [w("lid", "If honey"), -0.6, -0.8, 0.3],
          [c.s.crystals, 0.9, -0.1, 0.3],
        ],
        moves: [
          [tWalk1, 890, 900, 0.9, 1.6, "walk"],
          [tBack, 300, 900, 0.9, 1.4, "walk"],
          [tWalk2, 890, 900, 0.9, 1.1, "walk"],
          [c.s.crystals - 0.4, 1440, 900, 0.9, 1.1, "walk"],
        ],
      });

      const cam = Kit.camera($("#hon-cam"), [
        [c.s.tombs - 0.2, 1100, 520, 1.12, 3.5],
        [w("spoiled", "still") - 0.6, 1080, 600, 1.35, 0.9],
        [tBack, 960, 540, 1, 1.0],
        [c.s.crystals - 0.4, 1440, 560, 1.08, 1.0],
        [tWhip, 3600, 560, 1.08, 0.4, "in"],
      ]);
      const helmet = $("#hon-helmet");
      const lid = $("#hon-lid");
      const POT = [1150, 548];
      const FLOOR = [1300, 892];
      const mix = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
      const ez = Specs.EASE.inOut;
      function lidAt(t, hand) {
        // pot -> his hand -> dropped by the pedestal -> back on the pot
        if (t < tLift) return [POT, 0];
        if (t < tLift + 0.25) return [mix(POT, hand, ez((t - tLift) / 0.25)), -20 * ez((t - tLift) / 0.25)];
        if (t < tBack) return [[hand[0], hand[1] - 10], -20];
        if (t < tBack + 0.45) {
          const k = (t - tBack) / 0.45;
          return [mix([hand[0], hand[1] - 10], FLOOR, k * k), -20 + 20 * k];
        }
        if (t < tLidOn - 0.25) return [FLOOR, 0];
        if (t < tLidOn + 0.3) {
          const k = ez((t - tLidOn + 0.25) / 0.55);
          const p = mix(FLOOR, POT, k);
          return [[p[0], p[1] - Math.sin(k * Math.PI) * 120], 0];
        }
        return [POT, 0];
      }
      Kit.driver(tl, c.dur, (t) => {
        const p = rig.render(t);
        cam.render(t);
        const [lp, lr] = lidAt(t, p.handR);
        lid.setAttribute("transform", `translate(${lp[0].toFixed(1)} ${lp[1].toFixed(1)}) rotate(${lr.toFixed(1)})`);
        helmet.setAttribute("transform", `translate(${p.head[0].toFixed(1)} ${p.head[1].toFixed(1)}) rotate(${p.tilt.toFixed(1)}) scale(${p.scale})`);
      });

      // the question
      tl.fromTo("#hon-card", { x: 560, y: 520, scale: 0.08, transformOrigin: "50% 50%", rotation: 8, opacity: 0 }, { x: 1040, y: 200, scale: 1, rotation: -2, opacity: 1, duration: 0.55, ease: "back.out(1.6)" }, w("q", "Does") - 0.3);
      tl.to("#hon-card", { transformOrigin: "50% 50%", y: -260, rotation: 6, scale: 0.8, duration: 0.4, ease: "power3.in" }, c.s.tombs + 0.3);

      // the lid comes off: dust, then gold
      gsap.set(["#hon-dust", "#hon-sparkle"], { opacity: 0 });
      tl.fromTo("#hon-dust circle", { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1.3, duration: 0.4, ease: "power2.out", stagger: 0.05 }, tLift + 0.05);
      gsap.set("#hon-dust", { opacity: 1 });
      tl.to("#hon-dust circle", { opacity: 0, y: -40, duration: 0.6 }, tLift + 0.5);
      Kit.hide(tl, "#hon-cobweb", tLift + 0.1, 0.3);
      Kit.pop(tl, "#hon-sparkle path", w("spoiled", "spoiled") - 0.3, { stagger: 0.1, dur: 0.4 });
      gsap.set("#hon-sparkle", { opacity: 1 });
      tl.to("#hon-sparkle path", { rotation: 45, duration: 1.5, ease: "none", transformOrigin: "50% 50%" }, w("spoiled", "spoiled"));
      Kit.out(tl, "#hon-sparkle", c.s.how + 0.4, { dur: 0.3 });

      // a closer look: the lens grows out of the pot
      gsap.set(["#hon-lens", "#hon-t1", "#hon-t2", "#hon-t3", "#hon-panel"], { opacity: 0 });
      tl.fromTo("#hon-panel", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out", immediateRender: false }, tLens + 0.3);
      tl.to("#hon-panel", { opacity: 0, x: 40, duration: 0.3, ease: "power2.in" }, tLensOut);
      tl.fromTo("#hon-lens", { opacity: 1, scale: 0.12, x: 90, y: 30, transformOrigin: "50% 50%" }, { scale: 1, x: 0, y: 0, duration: 0.7, ease: "back.out(1.3)" }, tLens);
      tl.set("#hon-lens", { opacity: 0 }, 0);
      tl.set("#hon-lens", { opacity: 1 }, tLens);
      $$("#hon-sugar path").forEach((h, i) => {
        tl.fromTo(h, { rotation: -10 }, { rotation: 10, duration: 0.9 + (i % 3) * 0.2, ease: "sine.inOut", repeat: 14, yoyo: true, transformOrigin: "50% 50%" }, tLens);
      });

      // trick 1
      Kit.show(tl, "#hon-t1", w("sugar", "Trick one") - 0.1, 0.3);
      gsap.set(["#hon-germ1", "#hon-germ1-x", "#hon-flag", "#hon-drops-out"], { opacity: 0 });
      tl.set("#hon-germ1", { opacity: 1 }, w("germs", "germ") - 0.3);
      tl.fromTo("#hon-germ1", { y: -340 }, { y: 0, duration: 0.6, ease: "bounce.out", immediateRender: false }, w("germs", "germ") - 0.3);
      const tSuck = w("germs", "water sucked") - 0.1;
      tl.set("#hon-drops-out", { opacity: 1 }, tSuck);
      const outs = [[-170, -150], [170, -120], [-140, 160], [160, 150]];
      $$("#hon-drops-out circle").forEach((d, i) => {
        tl.fromTo(d, { x: 0, y: 0 }, { x: outs[i][0], y: outs[i][1], duration: 0.7, ease: "power2.out" }, tSuck + i * 0.12);
      });
      tl.to("#hon-drops-out", { opacity: 0, duration: 0.3 }, tSuck + 1.2);
      const tShrivel = w("germs", "shrivels") - 0.1;
      tl.to("#hon-germ1-body", { scale: 0.62, duration: 0.6, ease: "power2.inOut", transformOrigin: "50% 50%" }, tShrivel);
      tl.to("#hon-germ1-body use", { fill: "#a8b59a", duration: 0.6 }, tShrivel);
      tl.set("#hon-germ1-eyes", { opacity: 0 }, tShrivel + 0.3);
      tl.set("#hon-germ1-x", { opacity: 1 }, tShrivel + 0.3);
      tl.fromTo("#hon-flag", { opacity: 0, scaleY: 0, transformOrigin: "50% 100%" }, { opacity: 1, scaleY: 1, duration: 0.35, ease: "back.out(2)" }, w("germs", "gives up") - 0.1);
      tl.to("#hon-flag", { rotation: 8, duration: 0.25, yoyo: true, repeat: 5, ease: "sine.inOut", transformOrigin: "50% 100%" }, w("germs", "gives up") + 0.3);
      Kit.out(tl, "#hon-germ1", c.s.acid - 0.3, { dur: 0.3 });
      Kit.hide(tl, "#hon-t1", c.s.acid - 0.3, 0.25);

      // trick 2
      Kit.show(tl, "#hon-t2", w("acid", "Trick two") - 0.1, 0.3);
      gsap.set(["#hon-ph-honey", "#hon-ph-oj", "#hon-germ2"], { opacity: 0 });
      tl.fromTo("#hon-ph-honey", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, w("acid", "acidic") - 0.1);
      tl.fromTo("#hon-ph-oj", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, w("acid", "orange juice") - 0.15);
      tl.set("#hon-germ2", { opacity: 1 }, w("acid", "about") - 0.2);
      tl.fromTo("#hon-germ2", { x: -420 }, { x: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, w("acid", "about") - 0.2);
      tl.to("#hon-germ2", { x: 460, rotation: 30, duration: 0.6, ease: "power3.in" }, w("acid", "hate") + 0.1);
      Kit.hide(tl, "#hon-t2", c.s.enzyme - 0.3, 0.25);

      // trick 3
      Kit.show(tl, "#hon-t3", w("enzyme", "Trick three") - 0.1, 0.3);
      gsap.set(["#hon-zapper", "#hon-enzyme", "#hon-bee"], { opacity: 0 });
      const tBee = w("enzyme", "Bees") - 0.4;
      tl.set("#hon-bee", { opacity: 1 }, tBee);
      tl.fromTo("#hon-bee-in", { x: 2050, y: 260 }, { x: 1060, y: 380, duration: 1.0, ease: "power2.out" }, tBee);
      tl.fromTo("#hon-bee-in", { rotation: 0 }, { keyframes: [{ rotation: -8, duration: 0.25 }, { rotation: 6, duration: 0.25 }, { rotation: -4, duration: 0.25 }, { rotation: 0, duration: 0.25 }], transformOrigin: "50% 50%" }, tBee);
      tl.to(["#hon-wing1", "#hon-wing2"], { scaleY: 0.45, duration: 0.06, yoyo: true, repeat: 41, ease: "none", transformOrigin: "50% 100%" }, tBee);
      tl.set("#hon-enzyme", { opacity: 1 }, w("enzyme", "enzyme") - 0.3);
      Kit.pop(tl, "#hon-enzyme path", w("enzyme", "enzyme") - 0.3, { stagger: 0.12, dur: 0.35 });
      tl.to("#hon-bee-in", { x: 2100, y: 120, duration: 0.9, ease: "power2.in" }, c.e.enzyme + 0.1);
      Kit.hide(tl, "#hon-enzyme", c.s.peroxide + 0.5, 0.3);

      // a little water, hydrogen peroxide, germ zapped
      gsap.set(["#hon-wetdrop", "#hon-h2o2", "#hon-germ3", "#hon-zap", "#hon-poof"], { opacity: 0 });
      tl.set("#hon-wetdrop", { opacity: 1 }, w("peroxide", "wet") - 0.4);
      tl.fromTo("#hon-wetdrop", { y: -260 }, { y: 200, duration: 0.6, ease: "power2.in", immediateRender: false }, w("peroxide", "wet") - 0.4);
      tl.to("#hon-wetdrop", { opacity: 0, scale: 1.6, duration: 0.15, transformOrigin: "50% 50%" }, w("peroxide", "wet") + 0.2);
      tl.set("#hon-h2o2", { opacity: 1 }, w("peroxide", "hydrogen") - 0.3);
      Kit.pop(tl, "#hon-h2o2 > g", w("peroxide", "hydrogen") - 0.3, { stagger: 0.18, dur: 0.4 });
      tl.set("#hon-germ3", { opacity: 1 }, w("peroxide", "Germ") - 0.9);
      tl.fromTo("#hon-germ3", { x: 300 }, { x: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, w("peroxide", "Germ") - 0.9);
      tl.set("#hon-zap", { opacity: 1 }, w("peroxide", "zapper") - 0.25);
      tl.set("#hon-zap", { opacity: 0 }, w("peroxide", "zapper") + 0.1);
      tl.set("#hon-germ3", { opacity: 0 }, w("peroxide", "zapper"));
      tl.set("#hon-poof", { opacity: 1, scale: 0.5, transformOrigin: "50% 50%" }, w("peroxide", "zapper"));
      tl.to("#hon-poof", { scale: 1.3, opacity: 0, duration: 0.6, ease: "power2.out" }, w("peroxide", "zapper"));
      Kit.show(tl, "#hon-zapper", w("peroxide", "zapper") - 0.1, 0.2);
      Kit.hide(tl, "#hon-t3", tLensOut, 0.25);

      // lens closes back into the pot
      tl.to("#hon-lens", { scale: 0.1, x: 90, y: 30, opacity: 0, duration: 0.5, ease: "power3.in", transformOrigin: "50% 50%" }, tLensOut);

      // keep the lid on
      gsap.set("#hon-think", { opacity: 0 });
      tl.fromTo("#hon-think", { opacity: 0, scale: 0.6, transformOrigin: "80% 100%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, w("lid", "If honey") - 0.1);
      tl.fromTo("#hon-rain path", { y: -10 }, { y: 30, duration: 0.5, repeat: 5, ease: "none" }, w("lid", "If honey"));
      Kit.pop(tl, "#hon-fizz circle", w("lid", "ferment") - 0.2, { stagger: 0.08, dur: 0.3 });
      Kit.out(tl, "#hon-think", c.s.crystals - 0.2, { dur: 0.3 });

      // your jar goes cloudy, then a warm bath clears it
      gsap.set(["#hon-kitchen", "#hon-crystal", "#hon-bowl", "#hon-crys-label"], { opacity: 0 });
      Kit.show(tl, "#hon-kitchen", c.s.crystals - 0.4, 0.4);
      tl.to("#hon-glass-honey", { fill: "#f4dba6", duration: 0.8 }, w("crystals", "cloudy") - 0.1);
      Kit.show(tl, "#hon-crystal", w("crystals", "crunchy") - 0.2, 0.4);
      Kit.show(tl, "#hon-crys-label", w("crystals", "crystals") - 0.15, 0.2);
      Kit.draw(tl, "#hon-crys-label path", w("crystals", "crystals") - 0.2, 0.35);
      Kit.hide(tl, "#hon-crys-label", c.s.warm - 0.1, 0.25);
      tl.fromTo("#hon-bowl", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.5)" }, w("warm", "Warm") - 0.1);
      tl.fromTo("#hon-steam", { y: 0, opacity: 0.7 }, { y: -20, opacity: 0.2, duration: 0.8, repeat: 4, ease: "none" }, w("warm", "Warm") + 0.3);
      tl.to("#hon-glass-honey", { fill: "#f2a007", duration: 1.2 }, w("warm", "melts") - 0.3);
      Kit.hide(tl, "#hon-crystal", w("warm", "melts") - 0.2, 0.9);

      // whip to the next page
      tl.fromTo("#hon-whip", { opacity: 0, x: 300 }, { opacity: 0.6, x: -300, duration: 0.4, ease: "power2.in" }, tWhip + 0.05);

      window.__timelines[S] = tl;
    })();
  </script>
</template>
