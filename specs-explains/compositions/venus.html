  <script>
    (function () {
      const S = "venus";
      const c = Kit.cues(S);
      const w = c.w;
      const $ = (q) => document.querySelector(q);
      const $$ = (q) => Array.from(document.querySelectorAll(q));
      const tl = gsap.timeline({ paused: true });
      Kit.markers($("#ven-svg"));

      const tReach = w("q", "jar") - 0.5;
      const tCard = w("q", "Is a") - 0.3;
      const tOut = c.s.space + 0.2;
      const tRace = w("finish", "Venus") - 0.2;
      const RACE = 2.6;
      const tZoom = c.e.lead + 0.5;
      const ZOOM = 1.3;

      // ---------- Specs, in screen space ----------
      const reachJar = Specs.reach("reach-l", "L", (1372 - 1500) / 0.9, (452 - 640) / 0.9, -1);
      const rig = Specs.create($("#ven-specs"), {
        scene: S,
        x: 1500,
        y: 1450,
        s: 0.9,
        shadow: [[0, 0]],
        poses: [
          [0, "float", 0],
          [c.s.q - 0.2, "explain", 0.4],
          [tReach, reachJar, 0.4],
          [tReach + 0.6, "hold-up-l", 0.35, "back"],
          [tCard + 0.3, "think", 0.4],
          [c.s.space - 0.1, "shrug", 0.35, "back"],
          [tOut + 0.4, "float", 0.6],
          [c.s.day - 0.1, "present-r", 0.45],
          [c.s.year - 0.1, "explain-r", 0.4],
          [c.s.earth - 0.1, "present-r", 0.45],
          [c.s.slow - 0.1, "tired", 0.5],
          [c.s.zips - 0.1, "point-ur", 0.35, "back"],
          [c.s.finish - 0.1, "fist-up", 0.3, "back"],
          [tRace + RACE, "cheer", 0.35, "back"],
          [c.s.west - 0.1, "explain-r", 0.4],
          [w("west", "Sun rises") - 0.2, "point-ur", 0.35, "back"],
          [c.s.lead - 0.1, "hips", 0.4],
          [w("lead", "hot") - 0.2, "tired", 0.4],
          [tZoom - 0.6, "push-glasses", 0.35, "back"],
        ],
        faces: [
          [0, "happy", 0],
          [c.s.q, "excited", 0.3],
          [tCard, "thinking", 0.3],
          [c.s.space, "grin", 0.3],
          [c.s.day, "happy", 0.3],
          [c.s.slow, "sleepy", 0.4],
          [c.s.zips, "excited", 0.25],
          [c.s.finish, "excited", 0.25],
          [tRace + RACE, "proud", 0.3],
          [c.s.west, "amazed", 0.3],
          [c.s.lead, "skeptical", 0.3],
          [w("lead", "hot"), "worried", 0.3],
          [tZoom - 0.6, "smug", 0.3],
        ],
        looks: [
          [0, 0, -0.6, 0],
          [c.s.q, 0, 0.05, 0.3],
          [tReach, -0.9, 0.3, 0.3],
          [tCard, -0.6, -0.8, 0.3],
          [c.s.space, 0, 0.05, 0.3],
          [tOut + 0.6, 0.8, -0.6, 0.3],
          [c.s.finish, 0.9, -0.5, 0.3],
          [c.s.lead, 0, 0.05, 0.3],
          [w("lead", "hot"), 0.9, -0.4, 0.3],
          [tZoom - 0.6, 0, 0.05, 0.3],
        ],
        moves: [
          [0.1, 1500, 640, 0.9, 1.5, "out"],
          [tOut, 250, 1010, 0.6, 1.5, "inOut"],
          [c.s.lead + 0.2, 330, 990, 0.62, 0.8],
          [tZoom - 1.2, 960, 960, 0.85, 0.9],
        ],
      });
      const scam = Kit.camera($("#ven-scam"), [[tZoom, (t) => lens[0], (t) => lens[1], 62, ZOOM, "in"]]);
      let lens = [0, 0];

      // ---------- the world camera and the planets ----------
      const SUN = [700, 540];
      const DIAG = [829, 572, 0.62];
      const earthAng = Kit.track([[c.s.year + 0.3, 200 - 360, 3.2]], 200);
      const venusAng = Kit.track(
        [
          [w("zips", "zips") - 0.2, 30 - 360, 2.2],
          [tRace, 30 - 720, RACE, "linear"],
        ],
        30,
      );
      const earthSpin = Kit.track(
        [
          [w("day", "spin") - 0.3, -360, 2.4],
          [c.s.year + 0.3, -360 * 8, 3.2, "linear"],
        ],
        0,
      );
      const venusSpin = Kit.track(
        [
          [c.s.slow + 0.4, 40, 5.5, "linear"],
          [tRace, 40 + (360 * 225) / 243, RACE, "linear"],
        ],
        0,
      );
      const count = Kit.track([[tRace, 225, RACE, "linear"]], 0);
      const at = (ang, r) => [SUN[0] + Math.cos((ang * Math.PI) / 180) * r, SUN[1] + Math.sin((ang * Math.PI) / 180) * r];
      const E0 = at(200, 470);
      const V0 = at(30, 300);
      const cam = Kit.camera($("#ven-cam"), [
        [tOut, DIAG[0], DIAG[1], DIAG[2], 1.6],
        [c.s.day - 0.3, E0[0] - 22, E0[1] + 33, 1.8, 1.0],
        [c.s.year - 0.2, DIAG[0], DIAG[1], DIAG[2], 1.0],
        [c.s.slow - 0.3, V0[0] - 22, V0[1] + 33, 1.8, 1.0],
        [c.s.zips - 0.3, DIAG[0], DIAG[1], DIAG[2], 0.9],
      ], { cx: 1400, cy: 560, z: 1 });

      const earth = $("#ven-earth");
      const earthS = $("#ven-earth-spin");
      const venus = $("#ven-venus");
      const venusS = $("#ven-venus-spin");
      const helmet = $("#ven-helmet");
      const note = $("#ven-note");
      const sweat = $$("#ven-sweat .drop");
      const portal = $("#ven-portal");
      const barY = $("#ven-bar-year");
      const barD = $("#ven-bar-day");
      const counter = $("#ven-count");
      Kit.driver(tl, c.dur, (t) => {
        const p = rig.render(t);
        lens = p.lensL;
        scam.render(t);
        cam.render(t);
        helmet.setAttribute("transform", `translate(${p.head[0].toFixed(1)} ${p.head[1].toFixed(1)}) rotate(${p.tilt.toFixed(1)}) scale(${p.scale})`);
        portal.setAttribute("cx", lens[0].toFixed(2));
        portal.setAttribute("cy", lens[1].toFixed(2));
        portal.setAttribute("r", (22 * p.scale).toFixed(2));
        // the note he pulls from the jar, until the card takes over
        if (t > tReach + 0.45 && t < tCard + 0.05) {
          const h = p.handL;
          note.setAttribute("transform", `translate(${h[0].toFixed(1)} ${(h[1] - 14).toFixed(1)}) rotate(8)`);
          note.setAttribute("opacity", 1);
        } else note.setAttribute("opacity", 0);
        const ep = at(earthAng(t), 470);
        earth.setAttribute("transform", `translate(${ep[0].toFixed(1)} ${ep[1].toFixed(1)})`);
        earthS.setAttribute("transform", `rotate(${earthSpin(t).toFixed(2)})`);
        const vp = at(venusAng(t), 300);
        venus.setAttribute("transform", `translate(${vp[0].toFixed(1)} ${vp[1].toFixed(1)})`);
        venusS.setAttribute("transform", `rotate(${venusSpin(t).toFixed(2)})`);
        const n = count(t);
        barY.setAttribute("width", ((400 * n) / 225).toFixed(1));
        barD.setAttribute("width", ((400 * n) / 243).toFixed(1));
        counter.textContent = "day " + Math.round(n);
        const hot = t > w("lead", "hot");
        sweat.forEach((d, i) => {
          const k = ((t - w("lead", "hot") + i * 0.45) % 0.9) / 0.9;
          d.setAttribute("opacity", hot && t < tZoom ? (1 - k).toFixed(2) : 0);
          d.setAttribute("transform", `translate(${(p.head[0] + (i ? 70 : -70) * p.scale).toFixed(1)} ${(p.head[1] - 20 * p.scale + k * 60 * p.scale).toFixed(1)}) scale(${p.scale})`);
        });
      });

      // the jar drifts in; the card comes out of it
      tl.fromTo("#ven-jar", { x: -900, y: 120, rotation: -20 }, { x: 0, y: 0, rotation: 6, duration: 1.6, ease: "power2.out" }, 0.2);
      tl.fromTo("#ven-card", { x: 1150, y: 540, scale: 0.08, transformOrigin: "50% 50%", rotation: 8, opacity: 0 }, { x: 960, y: 190, scale: 1, rotation: -2, opacity: 1, duration: 0.55, ease: "back.out(1.6)" }, tCard);
      tl.to("#ven-card", { transformOrigin: "50% 50%", y: -260, rotation: 6, scale: 0.8, duration: 0.4, ease: "power3.in" }, c.s.space + 0.2);
      tl.to("#ven-jar", { x: 1600, y: -1800, rotation: 40, duration: 2.0, ease: "power1.in" }, tOut);

      // the system draws itself as the camera pulls back
      Kit.draw(tl, ["#ven-orbit-v", "#ven-orbit-e"], tOut + 0.5, 1.2, "power2.inOut", 0.2);
      gsap.set(["#ven-earth-arrow", "#ven-venus-arrow", "#ven-snail", "#ven-zoom", "#ven-panel", "#ven-race", "#ven-ring", "#ven-done", "#ven-rise", "#ven-hot"], { opacity: 0 });
      Kit.pop(tl, "#ven-sun", tOut + 0.3, { dur: 0.5 });
      Kit.pop(tl, ["#ven-earth-pop", "#ven-venus-pop"], tOut + 0.8, { dur: 0.45, stagger: 0.2 });
      Kit.show(tl, ["#ven-earth-label", "#ven-venus-label"], tOut + 1.1, 0.3);
      Kit.show(tl, "#ven-earth-arrow", w("day", "spin") - 0.4, 0.3);
      Kit.hide(tl, "#ven-earth-arrow", c.s.year + 0.2, 0.3);

      // the table
      tl.fromTo("#ven-panel", { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out", immediateRender: false }, c.s.earth - 0.2);
      gsap.set(["#ven-v-ed", "#ven-v-ey", "#ven-v-vd", "#ven-v-vy"], { opacity: 0 });
      Kit.pop(tl, "#ven-v-ed", w("earth", "once a day") - 0.1, { dur: 0.35 });
      Kit.pop(tl, "#ven-v-ey", w("earth", "three hundred") - 0.1, { dur: 0.35 });
      Kit.show(tl, "#ven-snail", c.s.slow + 0.6, 0.3);
      tl.fromTo("#ven-snail", { x: 0 }, { x: 40, duration: 5, ease: "none", immediateRender: false }, c.s.slow + 0.6);
      Kit.hide(tl, "#ven-snail", c.s.zips, 0.3);
      Kit.pop(tl, "#ven-v-vd", w("slow", "two hundred") - 0.1, { dur: 0.35 });
      Kit.show(tl, "#ven-zoom", w("zips", "zips") - 0.1, 0.2);
      Kit.hide(tl, "#ven-zoom", w("zips", "zips") + 2.0, 0.3);
      Kit.pop(tl, "#ven-v-vy", w("zips", "two hundred") - 0.1, { dur: 0.35 });
      tl.set("#ven-ring", { opacity: 1 }, c.s.finish);
      Kit.draw(tl, "#ven-ring", c.s.finish, 0.5);

      // the race
      Kit.show(tl, "#ven-race", tRace - 0.4, 0.3);
      Kit.pop(tl, "#ven-done", tRace + RACE, { dur: 0.4, origin: "0% 100%" });

      // backwards spin, sunrise in the west
      Kit.hide(tl, "#ven-panel", c.s.west - 0.2, 0.3);
      Kit.show(tl, "#ven-venus-arrow", c.s.west + 0.2, 0.3);
      tl.fromTo("#ven-rise", { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.5)", immediateRender: false }, w("west", "so on Venus") - 0.4);
      tl.fromTo("#ven-rise-sun", { y: 120 }, { y: -90, duration: 2.0, ease: "power1.out" }, w("west", "Sun rises") - 0.3);
      Kit.draw(tl, "#ven-rise-arrow", w("west", "rises") - 0.1, 0.5);
      tl.to("#ven-rise", { opacity: 0, scale: 0.9, duration: 0.3, ease: "power2.in", transformOrigin: "50% 50%" }, c.s.lead - 0.2);

      // hot enough to melt lead
      Kit.show(tl, "#ven-hot", c.s.lead + 0.1, 0.3);
      tl.fromTo("#ven-merc", { scaleY: 0.12, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 1.3, ease: "power2.out" }, c.s.lead + 0.3);
      tl.fromTo("#ven-lead-bar", { scaleY: 1, scaleX: 1, transformOrigin: "50% 100%" }, { scaleY: 0.1, scaleX: 1.4, duration: 1.4, ease: "power2.in" }, w("lead", "melt") - 0.2);
      tl.fromTo("#ven-puddle", { scaleX: 0.3, opacity: 0, transformOrigin: "50% 50%" }, { scaleX: 1, opacity: 1, duration: 1.2, ease: "power2.out" }, w("lead", "melt"));
      Kit.hide(tl, "#ven-hot", tZoom - 0.4, 0.3);

      // back home through his glasses
      tl.fromTo(portal, { opacity: 0 }, { opacity: 1, duration: ZOOM * 0.45, ease: "power1.in", immediateRender: false }, tZoom + ZOOM * 0.2);

      window.__timelines[S] = tl;
    })();
  </script>
</template>
