  <script src="assets/data/timing.js"></script>
  <script src="assets/data/lipsync.js"></script>
  <script src="assets/specs.js"></script>
  <script src="assets/kit.js"></script>
  <script>
    (function () {
      const S = "outro";
      const c = Kit.cues(S);
      const w = c.w;
      const $ = (q) => document.querySelector(q);
      const $$ = (q) => Array.from(document.querySelectorAll(q));
      const tl = gsap.timeline({ paused: true });
      Kit.markers($("#out-svg"));

      const X = 760;
      const tPeek = c.s.wait - 0.1;
      const tPull = w("wait", "one more") - 0.2;
      const tCard = c.s.next - 0.1;
      const tDrop = w("bye", "Drop") - 0.1;
      const tTitle = c.e.bye + 0.2;
      const peek = Specs.reach("reach-r", "R", (1250 - 1060) / 1, (650 - 905) / 1, 1);

      const rig = Specs.create($("#out-specs"), {
        scene: S,
        x: X,
        y: 905,
        s: 1,
        poses: [
          [0, "relaxed", 0],
          [c.s.empty - 0.1, "present-r", 0.45],
          [w("empty", "Empty") - 0.2, "shrug", 0.35, "back"],
          [c.s.recap1 - 0.1, "explain", 0.4],
          [w("recap1", "Octopuses") - 0.2, "point-ul", 0.35, "back"],
          [w("recap1", "Bananas") - 0.2, "point-ur", 0.35, "back"],
          [c.s.recap2 - 0.1, "explain-r", 0.4],
          [w("recap2", "taller") - 0.2, "arms-up", 0.35, "back"],
          [w("recap2", "Venus") - 0.2, "point-r", 0.35, "back"],
          [tPeek, "hand-ear", 0.3],
          [tPull - 0.1, peek, 0.4],
          [tPull + 0.6, "hold-up-r", 0.35, "back"],
          [tCard + 0.3, "point-ul", 0.4, "back"],
          [tDrop, "present-r", 0.4],
          [w("bye", "see you") - 0.3, "wave", 0.4, "back"],
        ],
        faces: [
          [0, "happy", 0],
          [w("empty", "Empty"), "amazed", 0.3],
          [c.s.recap1, "excited", 0.3],
          [c.s.recap2, "happy", 0.3],
          [tPeek, "surprised", 0.25],
          [tPull + 0.6, "excited", 0.3],
          [tCard + 0.3, "smug", 0.3],
          [w("bye", "see you") - 0.3, "grin", 0.3],
        ],
        looks: [
          [0, 0, 0.05, 0],
          [c.s.empty, 0.8, 0.3, 0.3],
          [c.s.recap1, -0.3, -0.8, 0.3],
          [c.s.recap2, 0.6, -0.8, 0.3],
          [tPeek, 0.8, 0.3, 0.3],
          [tCard + 0.3, -0.4, -0.8, 0.3],
          [tDrop, 0.8, 0.2, 0.3],
          [w("bye", "see you") - 0.3, 0, 0.05, 0.3],
        ],
        moves: [
          [tPeek - 0.2, 1060, 905, 1, 0.8, "walk"],
          [tTitle - 0.2, 960, 905, 1, 0.8, "walk"],
        ],
      });

      // start inside his lens and pull back out into the studio
      const start = rig.render(0);
      let lens = start.lensL;
      const cam = Kit.camera($("#out-cam"), [[0.05, 960, 540, 1, 1.45, "out"]], { cx: lens[0], cy: lens[1], z: 62 });
      const portal = $("#out-portal");
      const note = $("#out-note");
      Kit.driver(tl, c.dur, (t) => {
        const p = rig.render(t);
        lens = p.lensL;
        cam.render(t);
        portal.setAttribute("cx", lens[0].toFixed(2));
        portal.setAttribute("cy", lens[1].toFixed(2));
        if (t > tPull + 0.2 && t < tCard + 0.05) {
          const h = p.handR;
          note.setAttribute("transform", `translate(${h[0].toFixed(1)} ${(h[1] - 16).toFixed(1)}) rotate(-10)`);
          note.setAttribute("opacity", 1);
        } else note.setAttribute("opacity", 0);
      });
      tl.fromTo(portal, { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power1.out" }, 0.3);

      // the jar is empty
      tl.fromTo("#out-jar", { rotation: 0 }, { keyframes: [{ rotation: -8, duration: 0.15 }, { rotation: 7, duration: 0.15 }, { rotation: -4, duration: 0.15 }, { rotation: 0, duration: 0.15 }], transformOrigin: "50% 100%" }, w("empty", "Empty") - 0.1);
      gsap.set("#out-lastnote", { opacity: 0 });

      // stickers land as each answer is named
      const stickers = [
        ["#out-s1", "recap1", "sky"],
        ["#out-s2", "recap1", "Octopuses"],
        ["#out-s3", "recap1", "Bananas"],
        ["#out-s4", "recap2", "Honey"],
        ["#out-s5", "recap2", "taller"],
        ["#out-s6", "recap2", "Venus"],
      ];
      stickers.forEach(([sel, k, word]) => Kit.pop(tl, sel, w(k, word) - 0.15, { from: 1.6, dur: 0.35, ease: "power3.out" }));
      Kit.out(tl, stickers.map((s) => s[0]), c.s.wait - 0.2, { dur: 0.3, stagger: 0.04 });

      // one more note: it unfolds into the last question
      tl.set("#out-lastnote", { opacity: 1 }, tPeek);
      tl.set("#out-lastnote", { opacity: 0 }, tPull + 0.2);
      tl.fromTo("#out-card", { x: 1240, y: 520, scale: 0.08, transformOrigin: "50% 50%", rotation: -10, opacity: 0 }, { x: 860, y: 230, scale: 1, rotation: -2, opacity: 1, duration: 0.55, ease: "back.out(1.6)" }, tCard);
      tl.to("#out-card", { transformOrigin: "50% 50%", x: 1250, y: 680, scale: 0.05, rotation: 20, duration: 0.6, ease: "power3.in" }, tDrop + 0.3);
      tl.to("#out-card", { opacity: 0, duration: 0.12 }, tDrop + 0.82);
      tl.fromTo("#out-jar", { scaleY: 1 }, { scaleY: 0.92, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.out", transformOrigin: "50% 100%", immediateRender: false }, tDrop + 0.9);

      // end title
      gsap.set("#out-title", { opacity: 1 });
      const titleWords = Kit.words($("#out-title-sub"));
      tl.fromTo("#out-title-main", { opacity: 0, scale: 0.9, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, tTitle);
      Kit.draw(tl, "#out-title-line", tTitle + 0.3, 0.5);
      gsap.set(titleWords, { opacity: 0 });
      Kit.write(tl, titleWords, tTitle + 0.6, 0.08);

      window.__timelines[S] = tl;
    })();
  </script>
