          <g id="tal-gravity">
            <path d="M1270 90 L1270 190 M1240 160 L1270 196 L1300 160 M1350 70 L1350 190 M1320 160 L1350 196 L1380 160 M1430 90 L1430 190 M1400 160 L1430 196 L1460 160" fill="none" stroke="#e8453c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

      <!-- the question -->
      <g id="tal-card">
        <path class="ink" data-marker="#FFF1A8" d="M-500 -110 L500 -120 L508 114 L-508 120 Z" />
        <text class="marker" x="0" y="28" font-size="74" text-anchor="middle">Are you <tspan fill="#d6456a">taller</tspan> in the morning?</text>
      </g>
      <g id="tal-whip" stroke="#1f1d1a" stroke-width="6" stroke-linecap="round">
        <path d="M200 260 L900 260 M600 420 L1700 420 M100 600 L1100 600 M800 760 L1800 760 M300 900 L1200 900" />

  <script src="assets/data/timing.js"></script>
  <script src="assets/data/lipsync.js"></script>
  <script src="assets/specs.js"></script>
  <script src="assets/kit.js"></script>
  <script>
    (function () {
      const S = "taller";
      const c = Kit.cues(S);
      const w = c.w;
      const $ = (q) => document.querySelector(q);
      const $$ = (q) => Array.from(document.querySelectorAll(q));
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";
      Kit.markers($("#tal-svg"));

      const tGrow = w("yes", "centimetre") - 0.6;
      const tBed = w("night", "lie") - 0.45;
      const tWake = c.s.wake - 0.25;
      const tSpace = c.s.astro + 0.2;
      const tStretch = w("me", "whoever") - 0.2;
      const tUp = c.e.me + 0.35;
      const you = { uR: 24, fR: -56, hR: 2, uL: -14, fL: -6, swing: 0, talk: 0.4 };

      // float bob while in space
      const tPct = w("space", "three percent") - 0.2;
      const bob = [];
      for (let t = c.s.space; t < tUp; t += 1.3) bob.push([t, 760 + (bob.length % 2 ? 10 : -10)]);
      const rig = Specs.create($("#tal-specs"), {
        scene: S,
        x: 600,
        y: 900,
        s: 0.9,
        poses: [
          [0, "relaxed", 0],
          [c.s.q - 0.1, "explain", 0.4],
          [w("q", "Are you") - 0.2, you, 0.35, "back"],
          [c.s.yes - 0.1, "fist-up", 0.3, "back"],
          [tGrow + 0.9, "point-ur", 0.35, "back"],
          [w("yes", "Sometimes") - 0.2, "shrug", 0.35],
          [c.s.spine - 0.1, "present-r", 0.45],
          [c.s.gravity - 0.1, "tired", 0.5],
          [w("squeeze", "sitting") - 0.15, "crouch", 0.3],
          [w("squeeze", "standing") - 0.1, "relaxed", 0.3],
          [w("squeeze", "squeezed") - 0.2, "explain-r", 0.4],
          [tBed, "lie", 0.5],
          [c.s.sponge - 0.2, "sleep", 0.4],
          [tWake, "arms-up", 0.4, "back"],
          [tWake + 0.8, "point-ur", 0.35, "back"],
          [w("wake", "shrink") - 0.2, "tired", 0.5],
          [c.s.astro - 0.1, "arms-up", 0.4, "back"],
          [c.s.space - 0.1, "float", 0.6],
          [w("space", "three percent") - 0.2, "cheer", 0.35, "back"],
          [c.s.me - 0.1, "hand-chest", 0.4],
          [tStretch + 0.4, "arms-up", 0.35, "back"],
          [tUp, "float", 0.4],
        ],
        faces: [
          [0, "happy", 0],
          [w("q", "Are you"), "smug", 0.3],
          [c.s.yes, "excited", 0.25],
          [w("yes", "Sometimes"), "thinking", 0.3],
          [c.s.spine, "happy", 0.3],
          [c.s.gravity, "worried", 0.3],
          [c.s.squeeze, "wince", 0.3],
          [w("squeeze", "squeezed"), "worried", 0.3],
          [tBed, "sleepy", 0.4],
          [c.s.sponge - 0.2, "asleep", 0.4],
          [tWake, "excited", 0.25],
          [w("wake", "shrink"), "sleepy", 0.4],
          [c.s.astro, "excited", 0.3],
          [c.s.space, "amazed", 0.3],
          [c.s.me, "smug", 0.3],
          [tStretch, "shocked", 0.2],
          [tStretch + 1.2, "proud", 0.3],
        ],
        shadow: [[c.s.space - 0.3, 0]],
        looks: [
          [0, 0, 0.05, 0],
          [tGrow + 0.9, 0.7, -0.8, 0.3],
          [c.s.spine, 0.9, -0.3, 0.3],
          [c.s.gravity, 0.6, -0.9, 0.3],
          [c.s.squeeze, 0, 0.05, 0.3],
          [tWake + 0.8, 0.7, -0.8, 0.3],
          [c.s.astro, 0, 0.05, 0.3],
          [w("space", "three percent"), 0.9, -0.4, 0.3],
          [tStretch, 0, 1, 0.2],
          [tStretch + 1.2, 0, 0.05, 0.3],
          [tUp, 0, -1, 0.3],
        ],
        moves: [
          [tGrow, 600, 900, 0.936, 0.3, "back"],
          [tGrow + 0.9, 600, 900, 0.9, 0.4],
          [w("squeeze", "Walking") - 0.25, 470, 900, 0.9, 0.8, "walk"],
          [w("squeeze", "standing") - 0.2, 600, 900, 0.9, 0.6, "walk"],
          [tBed, 700, 738, 0.9, 0.55, "hop"],
          [tWake, 600, 900, 0.936, 0.6, "hop"],
          [w("wake", "shrink"), 600, 900, 0.9, 0.9],
          [c.s.space - 0.3, 760, 760, 0.9, 1.2],
          ...bob.map((b) => [b[0] + 1.0, 760, b[1], b[0] + 1.0 >= tPct ? 0.94 : 0.9, 1.3, "inOut"]),
          [tUp, 900, -1050, 0.94, 1.4, "in"],
        ],
      });

      // spine: seven bones with discs between, squashed by day and plumped by night
      const bones = [];
      const discs = [];
      const root = $("#tal-bones");
      for (let i = 0; i < 7; i++) {
        const b = document.createElementNS(NS, "g");
        b.innerHTML =
          '<path d="M-92 -10 L-60 -16 L60 -16 L92 -10 L92 10 L60 16 L-60 16 L-92 10 Z" fill="#efe6d0" stroke="#1f1d1a" stroke-width="5" stroke-linejoin="round"/>' +
          '<rect x="-58" y="-24" width="116" height="48" rx="16" fill="#efe6d0" stroke="#1f1d1a" stroke-width="5"/>';
        root.appendChild(b);
        bones.push(b);
        if (i < 6) {
          const d = document.createElementNS(NS, "ellipse");
          d.setAttribute("rx", "62");
          d.setAttribute("fill", "#ff8fa3");
          d.setAttribute("stroke", "#1f1d1a");
          d.setAttribute("stroke-width", "4");
          root.appendChild(d);
          discs.push(d);
        }
      }
      const SPX = 1350;
      const BASE = 820;
      const squash = Kit.track(
        [
          [c.s.gravity + 0.3, 0.45, 0.8],
          [w("squeeze", "squeezed"), 0.7, 0.8],
          [c.s.sponge + 0.4, -0.25, 2.2],
        ],
        0,
      );
      function drawSpine(t) {
        const dh = 30 * (1 - squash(t));
        for (let i = 0; i < 7; i++) {
          const y = BASE - 24 - i * (48 + dh);
          bones[i].setAttribute("transform", `translate(${SPX} ${y.toFixed(1)})`);
          if (i < 6) {
            discs[i].setAttribute("cx", SPX);
            discs[i].setAttribute("cy", (y - 24 - dh / 2).toFixed(1));
            discs[i].setAttribute("ry", Math.max(3, dh / 2).toFixed(1));
          }
        }
      }

      const cam = Kit.camera(
        $("#tal-cam"),
        [
          [0, 960, 540, 1, 0.45, "out"],
          [tGrow - 0.4, 760, 480, 2.0, 0.6],
          [c.s.spine - 0.4, 960, 540, 1, 0.8],
          [tWake + 0.6, 760, 480, 1.9, 0.6],
          [w("wake", "dinner") + 0.6, 960, 540, 1, 0.8],
          [tUp + 0.3, 960, -200, 1, 1.4, "inOut"],
        ],
        { cx: -1600, cy: 540, z: 1 },
      );
      const helmet = $("#tal-helmet");
      const zz = $$("#tal-zzz .z");
      Kit.driver(tl, c.dur, (t) => {
        const p = rig.render(t);
        drawSpine(t);
        cam.render(t);
        helmet.setAttribute("transform", `translate(${p.head[0].toFixed(1)} ${p.head[1].toFixed(1)}) rotate(${p.tilt.toFixed(1)}) scale(${p.scale})`);
        helmet.setAttribute("opacity", t >= c.s.astro ? 1 : 0);
        zz.forEach((z, i) => {
          const k = (t - c.s.sponge - i * 0.5) % 1.8;
          const on = t > c.s.sponge + i * 0.5 && t < tWake - 0.1;
          z.setAttribute("opacity", on ? Math.max(0, 1 - k / 1.8).toFixed(2) : 0);
          z.setAttribute("x", (p.head[0] + 40 + i * 26 + k * 20).toFixed(1));
          z.setAttribute("y", (p.head[1] - 70 - k * 60 - i * 10).toFixed(1));
        });
      });

      // whip in
      tl.fromTo("#tal-whip", { opacity: 0.6, x: 300 }, { opacity: 0, x: -400, duration: 0.45, ease: "power2.out" }, 0);

      // the question
      tl.fromTo("#tal-card", { x: 600, y: 520, scale: 0.08, transformOrigin: "50% 50%", rotation: 8, opacity: 0 }, { x: 1180, y: 200, scale: 1, rotation: -2, opacity: 1, duration: 0.55, ease: "back.out(1.6)" }, w("q", "Are you") - 0.3);
      tl.to("#tal-card", { transformOrigin: "50% 50%", y: -260, rotation: 6, scale: 0.8, duration: 0.4, ease: "power3.in" }, c.s.yes + 0.2);

      // grow, mark, shrink, mark: one centimetre
      gsap.set(["#tal-onecm", "#tal-daylabels", "#tal-winmoon", "#tal-night"], { opacity: 0 });
      Kit.draw(tl, "#tal-mark-hi", tGrow + 0.35, 0.3);
      Kit.draw(tl, "#tal-mark-lo", tGrow + 1.0, 0.3);
      Kit.show(tl, "#tal-onecm", w("yes", "centimetre") - 0.1, 0.25);
      Kit.hide(tl, "#tal-onecm", c.s.spine, 0.25);

      // spine
      gsap.set("#tal-spine", { opacity: 0 });
      Kit.show(tl, "#tal-spine", c.s.spine - 0.2, 0.2);
      tl.fromTo(bones, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out", stagger: 0.12 }, w("spine", "stack") - 0.3);
      Kit.pop(tl, discs, w("spine", "squishy") - 0.1, { stagger: 0.08, dur: 0.35 });
      Kit.draw(tl, "#tal-lab-bones path", w("spine", "bones") - 0.1, 0.35);
      Kit.show(tl, "#tal-lab-bones text", w("spine", "bones"), 0.25);
      Kit.draw(tl, "#tal-lab-discs path", w("spine", "discs") - 0.2, 0.35);
      Kit.show(tl, "#tal-lab-discs text", w("spine", "discs") - 0.1, 0.25);
      gsap.set(["#tal-gravity", "#tal-drops"], { opacity: 0 });
      tl.fromTo("#tal-gravity", { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, c.s.gravity - 0.1);
      tl.to("#tal-gravity", { y: 40, duration: 0.8, ease: "power2.in" }, c.s.gravity + 0.3);
      tl.to("#tal-gravity", { opacity: 0, duration: 0.3 }, c.s.night);

      // water squeezed out of the discs, and back in at night
      const dropOut = [[-160, -40], [170, -60], [-180, 60], [160, 40], [-150, 120], [180, 140]];
      const dropsEl = $$("#tal-drops .drop");
      dropsEl.forEach((d, i) => {
        d.setAttribute("cx", SPX);
        d.setAttribute("cy", 520 + (i - 2.5) * 60);
      });
      tl.set("#tal-drops", { opacity: 1 }, w("squeeze", "lose") - 0.2);
      dropsEl.forEach((d, i) => {
